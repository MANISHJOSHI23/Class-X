<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class-X Physics Presentations | D.A.V. Lohaghat</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-sidebar: #1e293b;
      --border: #334155;
      --primary: #38bdf8;
      --primary-hover: #7dd3fc;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --highlight: #f59e0b;
      --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -2px rgba(0, 0, 0, 0.3);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      background-color: var(--bg-main);
      color: var(--text-main);
      line-height: 1.6;
      display: flex;
      min-height: 100vh;
    }

    /* --- Sidebar Navigation --- */
    .sidebar {
      width: 280px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 2rem 1.5rem 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-header h1 {
      font-size: 1.5rem;
      margin: 0;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }

    .sidebar-header p {
      color: var(--primary);
      margin: 0.3rem 0 0 0;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    nav {
      padding: 1.5rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    nav a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      padding: 0.6rem 1rem;
      border-radius: 8px;
      transition: all 0.2s ease;
      display: block;
    }

    nav a:hover {
      background-color: rgba(56, 189, 248, 0.1);
      color: var(--primary);
    }

    /* --- Main Content Area --- */
    .main-content {
      flex-grow: 1;
      padding: 3rem 5%;
      min-width: 0;
    }

    .content-wrapper {
      max-width: 900px;
      margin: 0 auto;
    }

    /* --- Cards / Accordions --- */
    .card {
      background-color: var(--bg-sidebar);
      border: 1px solid var(--border);
      margin-bottom: 1.5rem;
      border-radius: 12px;
      box-shadow: var(--card-shadow);
      overflow: hidden;
      transition: border-color 0.2s ease;
    }

    .card:hover { border-color: var(--primary); }

    summary {
      padding: 1.25rem 1.5rem;
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      list-style: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    summary::-webkit-details-marker { display: none; }
    summary::after {
      content: "▼";
      font-size: 0.8rem;
      color: var(--text-muted);
      transition: transform 0.3s ease;
    }
    details[open] summary::after { transform: rotate(180deg); color: var(--primary); }
    details[open] summary {
      border-bottom: 1px solid var(--border);
      background-color: rgba(0,0,0,0.15);
    }

    .content { padding: 1.5rem; animation: fadeIn 0.3s ease-in-out; }

    .section-title {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin: 1.5rem 0 0.8rem 0;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
    }
    .section-title:first-child { margin-top: 0; }

    /* --- Links List --- */
    .link-list { list-style: none; padding: 0; margin: 0; }
    .link-list li { margin-bottom: 0.8rem; display: flex; flex-direction: column; align-items: flex-start; word-break: break-word; }
    .link-row { display: flex; align-items: center; }
    .link-icon { margin-right: 0.6rem; font-size: 1.1rem; opacity: 0.9; }

    .link-list a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s ease, transform 0.2s ease;
    }
    .link-list a:hover {
      color: var(--primary-hover);
      text-decoration: underline;
    }

    /* --- Updates Specific Styling --- */
    .updates-card {
      border: 1px solid var(--highlight);
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.1);
      background: linear-gradient(to right, rgba(30, 41, 59, 1), rgba(30, 41, 59, 0.8));
    }
    .updates-card summary { color: var(--highlight); }
    .badge-new {
      background-color: var(--highlight); color: #000; font-size: 0.7rem; font-weight: 700;
      padding: 0.15rem 0.5rem; border-radius: 4px; margin-left: 0.8rem; vertical-align: middle;
      letter-spacing: 0.05em;
    }
    .update-date {
      font-size: 0.8rem; color: var(--text-muted); display: block; margin-left: 1.7rem; margin-top: 0.2rem;
    }

    .footer-section { text-align: center; margin-top: 4rem; padding-bottom: 2rem; border-top: 1px solid var(--border); padding-top: 2rem;}

    @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

    /* --- Mobile Responsiveness --- */
    @media (max-width: 900px) {
      body { flex-direction: column; }

      .sidebar {
        width: 100%;
        height: auto;
        position: relative;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }

      .sidebar-header { padding: 1.5rem; text-align: center; }

      nav {
        flex-direction: row;
        overflow-x: auto;
        padding: 0.5rem 1rem;
        white-space: nowrap;
        gap: 0.5rem;
      }

      nav a { padding: 0.5rem 0.8rem; font-size: 0.85rem; }

      .main-content { padding: 2rem 1rem; }
    }
  </style>
  <script src="https://counterapi.com/c.js?ns=mysite.com" async></script>
</head>
<body>

<!-- Left Sidebar -->
<aside class="sidebar">
  <div class="sidebar-header">
    <h1>Class-X Physics</h1>
    <p>By Manish Joshi</p>
  </div>
  <nav id="nav-container"></nav>
</aside>

<!-- Right Main Content -->
<main class="main-content">
  <div class="content-wrapper" id="main-container">
    <!-- Cards will be injected here -->
  </div>

  <div class="footer-section">
    <div class="counterapi" style="min-height:60px" unique="true"></div>
  </div>
</main>

<script>
  /**
   * =====================================================================
   * SITE CONTENT CONFIGURATION
   * =====================================================================
   */
  const siteData = [
    {
      id: "chapter1",
      title: "Chapter 1: Light Reflection and Refraction",
      sections: [
        {
          heading: "PPT",
          links: [
            { name: "Part 1: Reflection of Light", url: "ch1/Reflection.html", type: "ppt" },
            { name: "Part 2: Refraction of Light", url: "ch1/Refraction.html", type: "ppt" }
          ]
        },
        {
          heading: "Summary Notes and Class Test (Pdf)",
          links: [
            { name: "Class Notes Reflection", url: "ch1/Reflection.pdf", type: "pdf" },
            { name: "Class Notes Refraction", url: "ch1/Refraction.pdf", type: "pdf" },
            { name: "Class Test 1", url: "ch1/Class test_1 X_2025-26.pdf", type: "pdf" },
            { name: "Class Test 2", url: "ch1/class_test_II_X.pdf", type: "pdf" },
            { name: "Science PA - I", url: "ch1/PA_I_SCIENCE_X_2025-26.pdf", type: "pdf" }
          ]
        },
        {
          heading: "CBSE PYQ (Topicwise)",
          links: [
            { name: "CBSE PYQ- Mirrors and Mirror Formula", url: "ch1/PYQ_mirror.pdf", type: "pdf" },
            { name: "CBSE PYQ- Refraction through glass slab and Refractive Index", url: "ch1/PYQ_Refraction_Glass_Slab.pdf", type: "pdf" },
            // ---> ACTIVE UPDATE WITH TODAY'S DATE <---
            { name: "CBSE PYQ- Lenses, Lens Formula and Power of Lens", url: "ch1/PYQ_Lens_and_Power.pdf", type: "pdf", date: "2026-07-05" },
            { name: "CBSE PYQ Complete Chapter 1 With Solutions", url: "ch1/PYQ_X_ch1.pdf", type: "pdf" }
          ]
        }
      ]
    },
    {
      id: "chapter2",
      title: "Chapter 2: The Human Eye and Colourful World",
      sections: [
        {
          heading: "PPT",
          links: [
            { name: "Part 1: Human Eye and the colourful world", url: "ch2/Eye.html", type: "ppt" }
          ]
        },
        {
          heading: "Summary Notes and Class Test (Pdf)",
          links: [
            { name: "Complete Notes - Human Eye and the colourful world", url: "ch2/Eye.pdf", type: "pdf" , date: "2026-07-29"},
            { name: "CBSE PYQ - Eye, Power of Accommodation", url: "ch2/PYQ_X_ch2_eye_accommodation.pdf", type: "pdf" , date: "2026-07-20"},
            { name: "CBSE PYQ - Myopia, Hypermetropia, and Presbyopia", url: "ch2/PYQ_X_ch2_eye_defects.pdf", type: "pdf" },
            { name: "CBSE PYQ - Prism, Dispersion, and Rainbow", url: "ch2/PYQ_X_ch2_Prism_and_dispersion.pdf", type: "pdf" },
            { name: "CBSE PYQ - Atmospheric Refraction and Scattering", url: "ch2/PYQ_X_ch2_Atmospheric_refraction_and_Scattering.pdf", type: "pdf" },
            { name: "CBSE Previous Year Questions With Solutions", url: "ch2/PYQ_X_ch2_With_Solutions.pdf", type: "pdf" }
          ]
        }
      ]
    },
    {
      id: "chapter3",
      title: "Chapter 3: Electricity",
      sections: [
        {
          heading: "PPT",
          links: [
            { name: "PPT - Electricity Part 1", url: "ch3/Electricity_Part1.pdf", type: "pdf" },
            { name: "PPT - Electricity Part 2", url: "ch3/Electricity_Part2.pdf", type: "pdf" }
          ]
        },
        {
          heading: "Summary Notes and Class Test (Pdf)",
          links: [
            { name: "CBSE PYQ - Electric Current, Potential Difference, Ohm's Law, Resistance, and Resistivity", url: "ch3/PYQ_X_ch3_Part_1.pdf", type: "pdf" },
            { name: "CBSE PYQ - Series and Parallel Combination of Resistors", url: "ch3/PYQ_X_ch3_Part_2.pdf", type: "pdf" },
            { name: "CBSE PYQ - Joule's law of Heating and Power", url: "ch3/PYQ_X_ch3_Part_3.pdf", type: "pdf" },
            { name: "CBSE Previous Year Questions With Solutions", url: "ch3/PYQ_X_ch3.pdf", type: "pdf" }
          ]
        }
      ]
    },
    {
      id: "chapter4",
      title: "Chapter 4: Magnetic Effect of Electric Current",
      sections: [
        {
          heading: "PPT",
          links: [
            { name: "PPT - Magnetic Effect of Electric Current", url: "ch4/Magnetic effect of electric current.pdf", type: "pdf" }
          ]
        },
        {
          heading: "Summary Notes and Class Test (Pdf)",
          links: [
            { name: "CBSE Previous Year Questions With Solutions", url: "ch4/PYQ_X_ch4.pdf", type: "pdf" }
          ]
        }
      ]
    }
  ];

  /*
   * =====================================================================
   * SITE RENDERER ENGINE
   * =====================================================================
   */
  const navContainer = document.getElementById('nav-container');
  const mainContainer = document.getElementById('main-container');

  const getIcon = (type) => {
    switch(type) {
      case 'ppt': return '🌐';
      case 'pdf': return '📄';
      case 'book': return '📚';
      case 'exam': return '📝';
      default: return '🔗';
    }
  };

  let recentUpdates = [];
  siteData.forEach(chapter => {
    chapter.sections.forEach(section => {
      section.links.forEach(link => {
        if (link.date) {
          recentUpdates.push({ ...link, chapterName: chapter.title.split(':')[0] });
        }
      });
    });
  });

  recentUpdates.sort((a, b) => new Date(b.date) - new Date(a.date));

  // Render Updates
  if (recentUpdates.length > 0) {
    const updatesLink = document.createElement('a');
    updatesLink.href = `#updates`;
    updatesLink.textContent = "🔥 Updates";
    navContainer.appendChild(updatesLink);

    const updatesTag = document.createElement('details');
    updatesTag.className = 'card updates-card';
    updatesTag.id = 'updates';
    updatesTag.open = true;

    const summaryTag = document.createElement('summary');
    summaryTag.textContent = "🔔 Recent Updates";
    updatesTag.appendChild(summaryTag);

    const contentDiv = document.createElement('div');
    contentDiv.className = 'content';
    const ul = document.createElement('ul');
    ul.className = 'link-list';

    recentUpdates.slice(0, 5).forEach(link => {
      const li = document.createElement('li');
      const target = (link.type === 'ppt' || link.url.startsWith('http')) ? '_blank' : '';
      const download = (link.type === 'pdf' || link.type === 'exam' || link.type === 'book') ? 'download' : '';
      const dateFormatted = new Date(link.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

      li.innerHTML = `
        <div class="link-row">
          <span class="link-icon">${getIcon(link.type)}</span>
          <a href="${link.url}" ${target ? `target="${target}"` : ''} ${download}>${link.name}</a>
          <span class="badge-new">NEW</span>
        </div>
        <span class="update-date">Added on ${dateFormatted} in ${link.chapterName}</span>
      `;
      ul.appendChild(li);
    });

    contentDiv.appendChild(ul);
    updatesTag.appendChild(contentDiv);
    mainContainer.appendChild(updatesTag);
  }

  // Render Chapters
  siteData.forEach(chapter => {
    const navLink = document.createElement('a');
    navLink.href = `#${chapter.id}`;
    navLink.textContent = chapter.title.includes(':') ? chapter.title.split(':')[0] : chapter.title;
    navContainer.appendChild(navLink);

    const detailsTag = document.createElement('details');
    detailsTag.className = 'card';
    detailsTag.id = chapter.id;

    const summaryTag = document.createElement('summary');
    summaryTag.textContent = chapter.title;
    detailsTag.appendChild(summaryTag);

    const contentDiv = document.createElement('div');
    contentDiv.className = 'content';

    chapter.sections.forEach(section => {
      const heading = document.createElement('h3');
      heading.className = 'section-title';
      heading.textContent = section.heading;
      contentDiv.appendChild(heading);

      const ul = document.createElement('ul');
      ul.className = 'link-list';

      section.links.forEach(link => {
        const li = document.createElement('li');
        const target = (link.type === 'ppt' || link.url.startsWith('http')) ? '_blank' : '';
        const download = (link.type === 'pdf' || link.type === 'exam' || link.type === 'book') ? 'download' : '';
        const badge = link.date ? `<span class="badge-new">NEW</span>` : '';

        li.innerHTML = `
          <div class="link-row">
            <span class="link-icon">${getIcon(link.type)}</span>
            <a href="${link.url}" ${target ? `target="${target}"` : ''} ${download}>${link.name}</a>
            ${badge}
          </div>
        `;
        ul.appendChild(li);
      });
      contentDiv.appendChild(ul);
    });
    detailsTag.appendChild(contentDiv);
    mainContainer.appendChild(detailsTag);
  });
</script>

</body>
</html>
